name: Publish image

# ghcr.io/grayhex/s60modern
#   push to main   -> :latest, :main, :sha-<short>
#   tag X.Y.Z / vX.Y.Z -> :X.Y.Z, :X.Y (never :latest, which follows main)
# Tags may be written with or without the leading "v" (0.10.0 or v0.10.0).
# Every architecture is built natively, smoke-tested as a running container and only then pushed. An
# architecture whose smoke test fails is NOT published; the manifest lists exactly what passed.
on:
  push:
    branches: [main]
    tags: ["v*.*.*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/grayhex/s60modern

jobs:
  build:
    name: build + smoke test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            required: true
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            required: false
    runs-on: ${{ matrix.runner }}
    # amd64 is the verified baseline. arm64 is published only if it builds and passes the same smoke test.
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (loaded locally for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: symport-smoke:${{ strategy.job-index }}
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test the running container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:8765:8765 symport-smoke:${{ strategy.job-index }}
          trap 'docker logs smoke || true; docker rm -f smoke || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/state > /tmp/state.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          python3 -c 'import json; assert json.load(open("/tmp/state.json"))["schema"] == "symport.web/1"'
          curl --fail --silent http://127.0.0.1:8765/ | grep -q 'symport-token'
          test "$(docker exec smoke id -u)" = "10001"
          docker exec smoke python tools/check_gammu_contract.py
          docker exec smoke python -m symport theme build --variant light --json | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          docker exec smoke python -c 'import platform; print(platform.machine())'
      - name: Home LAN mode smoke test (login, strict Host, fail-closed configuration)
        run: tools/ci/lan_smoke.sh symport-smoke:${{ strategy.job-index }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish multi-arch manifest
    needs: build
    # amd64 is required: if it failed the whole build result is `failure` and nothing is published.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=SymPort
            org.opencontainers.image.description=Nokia S60/Symbian device workspace (local web UI)
            org.opencontainers.image.licenses=MIT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list from the digests that passed
        working-directory: /tmp/digests
        run: |
          ls
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
