name: React frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Static checks, unit tests and the production build. The build is shared with the browser jobs below.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/upload-artifact@v7
        with:
          name: symport-react-static
          path: symport/react_assets/
          retention-days: 7

  # Browser checks against the real Python server on synthetic data, split into groups that run in parallel.
  e2e:
    name: e2e (${{ matrix.group }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Most checks walk every page, so they start the interface in developer mode (SYMPORT_UI_MODE);
          # check_modes tests the real first start in user mode and sets the mode itself.
          - group: core
            ui-mode: developer
            checks: check_react_ui check_react_workspace check_p0_ui check_connection_wizard check_layout
          - group: devices
            ui-mode: developer
            checks: check_p1_ui check_n95_ui check_n97_mini_ui check_7610_ui check_n8_e7_ui
          - group: revive
            ui-mode: developer
            checks: check_revive_ui
          - group: modes
            ui-mode: ""
            checks: check_modes check_lan_login
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: symport-react-static
          path: symport/react_assets/
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: tools/ci/apt-install.sh g++ ffmpeg libgammu-dev pkg-config
      - run: pip install -e '.[dev,phone]'
      - uses: ./.github/actions/browser-tools
      - run: tools/s60/build.sh
      - name: Browser checks
        env:
          SYMPORT_UI_MODE: ${{ matrix.ui-mode }}
        run: |
          for check in ${{ matrix.checks }}; do
            echo "::group::$check"
            node "tools/$check.cjs"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: react-screenshots-${{ matrix.group }}
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 7
