name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install ruff
      - name: Ruff (symport, tests)
        run: ruff check .
      - name: Syntax check of legacy tools
        run: python -m py_compile tools/*.py tools/s60/*.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: pyproject.toml }
      - run: tools/ci/apt-install.sh g++ ffmpeg
      - run: pip install -e '.[dev]'
      - name: Unit, CLI and regression tests
        run: pytest -ra -n auto

  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: tools/ci/apt-install.sh g++ ffmpeg
      - run: pip install -e '.[dev]'
      - name: Build skc and bmconv from vendored sources
        run: tools/s60/build.sh
      - name: P1 native theme/resource integration tests
        run: pytest tests/test_p1_workspace.py -ra
      - name: Environment survey
        run: |
          mkdir -p build/reports
          symport doctor --json --report build/reports/doctor.json
      - name: Rebuild both theme variants (legacy entry point, unchanged)
        run: python3 tools/build_theme.py
      - name: Rebuild through SymPort
        run: symport theme build --report build/reports/theme-build.json
      - name: Inspect outputs and check reproducibility
        run: symport theme inspect --reproducible --report build/reports/theme-inspect.json
      - name: Package (experimental native writer; official makesis is not available on runners)
        run: symport theme package --backend native --report build/reports/theme-package-native.json
      - name: Package without an explicit backend must report "unsupported" (exit 3), not fake success
        run: |
          set +e
          symport theme package --report build/reports/theme-package-auto.json
          test $? -eq 3
      - name: Compatibility matrix
        run: symport report matrix build/reports --report build/reports/matrix.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: symport-theme-${{ github.sha }}
          path: |
            build/reports/
            build/symport/theme/
            theme/dist/
          if-no-files-found: warn

  real-sdk:
    # Informational, non-gating: exercises SymPort against the real symbian-platform SDK (external download).
    # Runs on main and on demand, not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - name: Host toolchain required by the SDK (ARM-capable clang, lld, cmake)
        run: tools/ci/apt-install.sh clang lld cmake
      - run: pip install -e '.[dev]'
      - name: Install symbian-platform (CLI only, without the GUI console dependencies)
        run: |
          pip install --only-binary=:all: --no-deps symbian-platform
          pip install --only-binary=:all: "pydantic>=2.12,<3" "fastapi>=0.115,<1" "httpx>=0.28,<1" "msgpack>=1,<2" "pygments>=2.18,<3"
      - name: Build the SDK's E32 probe, package it, cross-check parsers
        run: tools/sdk/verify-real-sdk.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: symport-real-sdk-${{ github.sha }}
          path: build/reports/
          if-no-files-found: warn

  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose configuration
        run: |
          docker compose config -q
          docker compose -f compose.deploy.yaml config -q
          SYMPORT_HTTP_PORT=8778 docker compose -f compose.deploy.yaml config -q
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker workbench image (layer cache shared with the other image jobs)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: e52modern-workbench:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Home LAN mode (fail-closed configuration, login, strict Host)
        run: tools/ci/lan_smoke.sh e52modern-workbench:ci
      - name: Launch workbench and check HTTP API
        run: |
          docker run -d --name e52modern-ui -p 127.0.0.1:8765:8765 e52modern-workbench:ci
          trap 'docker logs e52modern-ui || true; docker rm -f e52modern-ui || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/state > /tmp/workbench-state.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          python3 -c 'import json; d=json.load(open("/tmp/workbench-state.json")); assert d["schema"] == "symport.web/1"'
          docker exec e52modern-ui python tools/check_gammu_contract.py
          docker exec -i e52modern-ui python - <<'PY'
          import base64, tempfile, urllib.request
          from pathlib import Path
          from symport.phone.registry import identify
          from symport.sis.reader import inspect
          from symport.theme.studio import ThemeStudio
          assert identify("N95")["variant_known"] is False
          assert identify("N97mini")["id"] == "nokia-n97-mini"
          assert identify("N97") is None
          with tempfile.TemporaryDirectory() as folder:
              studio = ThemeStudio(Path(folder))
              assert "nokia-n97-mini" not in studio.execute({"action":"list"})["profiles"]
              try:
                  studio.execute({"action":"create", "profile":"nokia-n97-mini", "name":"Blocked"})
              except ValueError as error:
                  assert "S60 5th" in str(error)
              else:
                  raise AssertionError("Mini theme creation must be blocked")
          assert identify("N95", rm="RM-320")["id"] == "nokia-n95-8gb"
          for key in ("nokia-n95", "nokia-n95-8gb"):
              with tempfile.TemporaryDirectory() as folder:
                  studio = ThemeStudio(Path(folder))
                  p = studio.execute({"action": "create", "name": "FP1 smoke", "profile": key})
                  p = studio.execute({"action": "build", "id": p["id"], "revision": p["revision"], "confirm_unsigned": True})
                  raw = base64.b64decode(studio.execute({"action": "export", "id": p["id"]})["content"])
                  assert [d["uid"] for d in inspect(raw)["dependencies"]["items"] if d["kind"] == "target-device"] == [0x102032BE]
                  assert p["build"]["physical_device"] == "not-tested"
              assert urllib.request.urlopen("http://127.0.0.1:8765/phones/" + key + ".png").headers.get_content_type() == "image/png"
          PY
          docker exec e52modern-ui python -m symport theme build --variant light --json > /tmp/workbench-build.json
          docker exec e52modern-ui python -m symport theme package --variant light --backend native --json > /tmp/workbench-package.json
          python3 -c 'import json; assert json.load(open("/tmp/workbench-build.json"))["status"] == "ok"; assert json.load(open("/tmp/workbench-package.json"))["status"] == "ok"'

      - uses: ./.github/actions/browser-tools
      - name: Real MGO/EKA2L1 and browser smoke without proprietary ROM
        run: |
          docker tag e52modern-workbench:ci e52modern-workbench:local
          mkdir -p build/reports
          trap 'docker logs symport-lab-runtime-ui || true; docker rm -f symport-lab-runtime-ui || true; docker compose -p symport-lab-smoke --profile emulator logs mgo-symbian || true; docker compose -p symport-lab-smoke --profile emulator down -v || true' EXIT
          docker compose -p symport-lab-smoke --profile emulator up -d mgo-symbian
          docker compose -p symport-lab-smoke run --rm -T --no-deps workbench python tools/check_mgo_runtime.py | tee build/reports/mgo-runtime.json
          docker run --rm -d --name symport-lab-runtime-ui --network symport-lab-smoke_emulator -p 127.0.0.1:8775:8775 -v symport-lab-smoke_mgo-symbian-auth:/symbian-auth:ro -e SYMPORT_MGO_URL=http://mgo-symbian:8766 -e SYMPORT_MGO_TOKEN_FILE=/symbian-auth/agent-token -e SYMPORT_UI_MODE=developer --cap-drop ALL --security-opt no-new-privileges e52modern-workbench:local python -m symport.web --host 0.0.0.0 --port 8775
          docker network connect symport-lab-smoke_default symport-lab-runtime-ui
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_emulator_runtime_ui.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_react_runtime_ui.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mgo-real-runtime-without-rom
          path: |
            build/reports/mgo-runtime.json
            build/screenshots/emulator-lab-*.png
            build/screenshots/emulator-runtime-negative.json

  device-manager-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate browser script and Compose
        run: |
          node --check symport/web_assets/manager.js
          node --check symport/web_assets/library.js
          node --check symport/web_assets/suite.js
          node --check symport/web_assets/catalog.js
          node --check symport/web_assets/lab.js
          node --check symport/web_assets/preferences.js
          node --check symport/web_assets/inspector.js
          node --check symport/web_assets/device-workspace.js
          node --input-type=module --check < symport/web_assets/ringtone.js
          bash -n tools/install.sh
          SYMPORT_BRIDGE_KEY=00000000000000000000000000000000 SYMPORT_SSH_TARGET=test@example.invalid SYMPORT_SSH_KEY_FILE=/tmp/key SYMPORT_SSH_KNOWN_HOSTS=/tmp/known_hosts docker compose -f compose.yaml -f compose.bridge.yaml config --quiet
          SYMPORT_HTTP_PORT=8777 docker compose config --quiet
          SYMPORT_PHONE_DIRECTORY=/tmp docker compose -f compose.yaml -f compose.phone.yaml config --quiet
          docker compose --profile emulator config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build Device Manager image (layer cache shared with the other image jobs)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: symport-device-manager:ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Smoke test HTTP and transport dependencies
        run: |
          docker run -d --name device-manager -e 'SYMPORT_DEVICE_ROOTS={"smoke":"/srv/e52modern/workspace/media-smoke"}' -p 127.0.0.1:8765:8765 symport-device-manager:ci
          trap 'docker logs device-manager; docker rm -f device-manager' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/state > /tmp/state.json; then break; fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/state.json"))["schema"] == "symport.web/1"'
          docker exec device-manager sh -c 'command -v gammu && command -v obexftp'
          docker exec device-manager python tools/check_gammu_contract.py
          docker exec device-manager python tools/check_device_container.py
          docker run --rm --network none symport-device-manager:ci python tools/check_ringtone_container.py
      - name: P1 persistent-container API and native compiler checks
        run: python tools/check_p1_container.py --image symport-device-manager:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p1-container-report
          path: build/reports/p1-container.json
          if-no-files-found: ignore

  phone-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Audio processing dependency
        run: tools/ci/apt-install.sh ffmpeg
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e '.[dev]'
      - uses: ./.github/actions/browser-tools
      - name: Exercise contacts, files, media, packages and theme library
        run: |
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_web_ui.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_app_catalog.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_emulator_lab.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_security_workspace.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_device_workspace.cjs
          NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_ringtone_ui.cjs
      - name: Browser pairing and outbound Windows Bridge integration
        run: NODE_PATH="$RUNNER_TEMP/symport-browser/node_modules" node tools/check_bridge_ui.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone-workspace-screenshots
          path: build/screenshots/
