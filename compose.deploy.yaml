# SymPort — one-file deployment from the published image (Portainer, UGREEN Docker, plain `docker compose`).
# No `build:` and no repository checkout needed:
#   Portainer: Stacks → Add stack → Web editor → paste this file → Deploy.
#   CLI:       docker compose -f compose.deploy.yaml up -d
# Guide: docs/DEPLOY_PORTAINER.md
#
# Access mode. Home LAN is the DEFAULT of this file (priority scenario: a home NAS such as UGREEN). Set in the stack:
#   SYMPORT_BIND=<NAS LAN IP>            e.g. 192.168.1.5 (the exact address you open in the browser)
#   SYMPORT_ADMIN_PASSWORD=<own secret>  at least 12 characters; there is no default password
# SymPort then shows its own login screen at http://<nas-ip>:8765. Without both values the container does NOT
# start and the log says what is missing (it never serves an unprotected API). Plain HTTP: trusted home network
# only; never forward this port on your router.
# Localhost instead (SSH tunnel / authenticated HTTPS proxy): SYMPORT_ACCESS_MODE=localhost, SYMPORT_BIND=127.0.0.1.

name: symport

services:
  workbench:
    image: ${SYMPORT_IMAGE:-ghcr.io/grayhex/s60modern:latest}
    # `missing` keeps a pulled image; use Portainer's "Re-pull image" (or `docker compose pull`) to update.
    pull_policy: ${SYMPORT_PULL_POLICY:-missing}
    restart: unless-stopped
    command: ["python", "-m", "symport.web", "--host", "0.0.0.0", "--port", "${SYMPORT_HTTP_PORT:-8765}"]
    init: true
    ports:
      - "${SYMPORT_BIND:-127.0.0.1}:${SYMPORT_HTTP_PORT:-8765}:${SYMPORT_HTTP_PORT:-8765}"
    volumes:
      - symport-build:/srv/e52modern/build
      - symport-workspace:/srv/e52modern/workspace
      - mgo-symbian-auth:/symbian-auth:ro
      # Optional phone/card folder (read-only recommended), then set SYMPORT_DEVICE_ROOTS='{"phone":"/phone"}':
      # - /volume1/phone:/phone:ro
      # Optional: keep the admin password in a file instead of an environment variable, then set
      # SYMPORT_ADMIN_PASSWORD_FILE=/run/secrets/symport-admin-password
      # - /volume1/docker/symport/admin-password:/run/secrets/symport-admin-password:ro
    environment:
      SYMPORT_FRONTEND: ${SYMPORT_FRONTEND:-react}
      # Interface mode of a fresh browser: user (default) or developer. Each user's own choice is remembered.
      SYMPORT_UI_MODE: ${SYMPORT_UI_MODE:-}
      SYMPORT_HTTP_PORT: ${SYMPORT_HTTP_PORT:-8765}
      SYMPORT_PUBLIC_ORIGIN: ${SYMPORT_PUBLIC_ORIGIN:-}
      # Home LAN is the default mode; set SYMPORT_ACCESS_MODE=localhost for the SSH/proxy-only setup. Validated at startup (fail closed).
      SYMPORT_ACCESS_MODE: ${SYMPORT_ACCESS_MODE:-lan}
      SYMPORT_BIND: ${SYMPORT_BIND:-127.0.0.1}
      SYMPORT_LAN_HOST: ${SYMPORT_LAN_HOST:-}
      SYMPORT_ADMIN_PASSWORD: ${SYMPORT_ADMIN_PASSWORD:-}
      SYMPORT_ADMIN_PASSWORD_HASH: ${SYMPORT_ADMIN_PASSWORD_HASH:-}
      SYMPORT_ADMIN_PASSWORD_FILE: ${SYMPORT_ADMIN_PASSWORD_FILE:-}
      SYMPORT_SESSION_IDLE_MINUTES: ${SYMPORT_SESSION_IDLE_MINUTES:-}
      SYMPORT_SESSION_MAX_MINUTES: ${SYMPORT_SESSION_MAX_MINUTES:-}
      SYMPORT_CONNECTIONS_FILE: ${SYMPORT_CONNECTIONS_FILE:-}
      SYMPORT_MGO_URL: http://mgo-symbian:8766
      SYMPORT_MGO_TOKEN_FILE: /symbian-auth/agent-token
      SYMPORT_GAMMU_CONFIG: ${SYMPORT_GAMMU_CONFIG:-}
      SYMPORT_DEVICE_ROOTS: "${SYMPORT_DEVICE_ROOTS:-{}}"
      SYMPORT_BRIDGE_URL: ${SYMPORT_BRIDGE_URL:-}
      SYMPORT_BRIDGE_KEY: ${SYMPORT_BRIDGE_KEY:-}
      SYMPORT_BRIDGE_AGENT_PORT: ${SYMPORT_BRIDGE_AGENT_PORT:-8765}
    networks: [default, emulator]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('SYMPORT_HTTP_PORT','8765')+'/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional Emulator Lab (profile `emulator`; linux/amd64 only, needs your own firmware). Not started by default.
  mgo-symbian:
    profiles: [emulator]
    image: ghcr.io/grayhex/mgo-symbian@sha256:83e62c6737a1cdcdf992bd8d3803738ff6a73b278a71118e69318446db4789cc
    restart: unless-stopped
    init: false
    environment:
      AGENT_TOKEN_FILE: /symbian-auth/agent-token
      MAX_FIRMWARE_BYTES: 2147483648
      MAX_INSTANCE_SECONDS: 7200
    volumes:
      - mgo-symbian-data:/data
      - mgo-symbian-auth:/symbian-auth
    networks: [emulator]
    read_only: true
    tmpfs: [/tmp:size=512m]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 3g
    pids_limit: 512

networks:
  emulator:
    internal: true

volumes:
  symport-build:
  symport-workspace:
  mgo-symbian-data:
  mgo-symbian-auth:
