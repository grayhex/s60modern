[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symport"
version = "0.1.0"
description = "SymPort Phone Workspace: contacts, files, media, local themes and development tools for Symbian S60"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vobject>=0.9.9,<1", "cryptography>=46,<51"]

[project.optional-dependencies]
transport-discovery = ["pyserial>=3.5,<4"]
bridge = ["pyserial>=3.5,<4", "websockets>=15,<18", "pystray>=0.19.5,<0.20", "pillow>=10"]
bridge-build = ["pyinstaller>=6.13,<7"]
phone = ["python-gammu>=3.2.6,<4"]
media = ["pillow>=10"]
theme = ["pillow>=10"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "ruff>=0.5", "pillow>=10", "pyyaml>=6"]

[project.scripts]
symport = "symport.cli:main"
symport-bridge = "symport.bridge.main:main"

[tool.setuptools.packages.find]
include = ["symport*"]

[tool.setuptools.package-data]
symport = ["react_assets/*.html", "react_assets/*.txt", "react_assets/assets/*", "react_assets/brand/*", "react_assets/phones/*", "react_assets/fonts/*", "phone/*.json", "revive/*.json", "web_assets/vendor/wavesurfer/*.js", "web_assets/vendor/wavesurfer/plugins/*.js", "web_assets/vendor/wavesurfer/LICENSE", "web_assets/vendor/wavesurfer/PROVENANCE.json", "web_assets/auth/*", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/fonts/*.ttf", "web_assets/fonts/*.txt", "web_assets/phones/*.png", "web_assets/phones/*.svg", "web_assets/phones/*.webp", "web_assets/phones/*.json", "web_assets/phones/*.md", "web_assets/brand/*.svg", "web_assets/brand/*.png", "web_assets/brand/*.md", "web_assets/icons/outline/*.svg", "web_assets/icons/tiles/*.svg", "web_assets/icons/png/*.png", "web_assets/graphics.json", "web_assets/translations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools", "theme", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
